[project]
name = "frc-scout"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "requests>=2.34.2",
    "scipy>=1.17.1",
]

[project.scripts]
frc-scout = "frc_scout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
